name: PR Summary (GPT-4o-mini)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  pr-summary:
    name: Summarize PR with GPT-4o-mini
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff against origin/main
        run: |
          git fetch origin main --depth=200 || true
          git diff origin/main...HEAD > pr_diff.txt
          echo "Diff size: $(wc -c < pr_diff.txt) bytes"

      - name: Call OpenAI gpt-4o-mini
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -e
          SYSTEM_MSG='You are a senior software engineer reviewing a pull request. Analyze the git diff and return ONLY a valid JSON object with exactly these fields: { "summary": "one paragraph description of what changed", "breaking_changes": ["list of breaking changes or empty array"], "risk_level": "low or medium or high" }. Return nothing else, no markdown, no explanation.'

          # Truncate enormous diffs so we stay within the 500-token response budget.
          head -c 60000 pr_diff.txt > pr_diff_trimmed.txt

          jq -Rs --arg sys "$SYSTEM_MSG" '{
            model: "gpt-4o-mini",
            max_tokens: 500,
            messages: [
              { role: "system", content: $sys },
              { role: "user", content: . }
            ]
          }' < pr_diff_trimmed.txt > request_body.json

          curl -sS https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @request_body.json \
            -o openai_response.json

          echo "OpenAI response saved."

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            function riskEmoji(level) {
              const l = (level || '').toLowerCase();
              if (l === 'low')    return '🟢';
              if (l === 'medium') return '🟡';
              if (l === 'high')   return '🔴';
              return '⚪';
            }

            async function postFallback(reason) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body: `## PR Summary\n\nPR summary unavailable — OpenAI API error.\n\n<sub>${reason}</sub>`,
              });
            }

            try {
              const raw = fs.readFileSync('openai_response.json', 'utf8');
              const response = JSON.parse(raw);

              if (response.error) {
                core.warning(`OpenAI error: ${response.error.message}`);
                await postFallback(response.error.message || 'unknown error');
                return;
              }

              const content = response?.choices?.[0]?.message?.content;
              if (!content) {
                await postFallback('empty response from model');
                return;
              }

              let parsed;
              try {
                parsed = JSON.parse(content);
              } catch (e) {
                // Sometimes the model wraps JSON in a code fence — strip and retry.
                const stripped = content.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
                parsed = JSON.parse(stripped);
              }

              const summary = parsed.summary || '(no summary)';
              const breaking = Array.isArray(parsed.breaking_changes) ? parsed.breaking_changes : [];
              const risk = parsed.risk_level || 'unknown';

              const breakingMd = breaking.length
                ? breaking.map(b => `- ${b}`).join('\n')
                : 'None';

              const body = [
                '## PR Summary',
                '',
                '### What Changed',
                summary,
                '',
                '### Breaking Changes',
                breakingMd,
                '',
                '### Risk Level',
                `${riskEmoji(risk)} **${risk}**`,
                '',
                '<sub>Generated by GPT-4o-mini.</sub>',
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                issue_number: context.issue.number,
                body,
              });

              if (breaking.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['breaking-change'],
                });
              }
            } catch (err) {
              core.warning(`Failed to post AI summary: ${err.message}`);
              await postFallback(err.message);
            }
